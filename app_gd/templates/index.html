<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Страница</title>
    <style>
        h1
        {
            color: white;
        }
        div
        {
            color: white;
            border: solid 1px white;
        }
        a
        {
            color:white
        }
        a:link
        {
            color:white
        }
        a:visited
        {
            color:white
        }
    </style>
</head>
<body bgcolor="black">
    <h1 style="color:white"> {{text}} </h1>
    {% if link %}
        <a href="{{link}}">Переход</a>
    {% endif %}

    {% if link_home %}
    <br>
        <a href="{{link_home}}">Переход</a>
    {% endif %}

    {% if list %}
    <br>
    {% for el in list %}
        <div align="center">
            {{el}}
        </div>
    {% endfor %}
    <br>
    <h1>Форма создания</h1>
    <form method="post" action="fruit/create">
        {{ form_create }}
        <input type="submit" value="Отправить">
    </form>
    <br>
    <h1>Форма удаления</h1>
    <form method="post" action="fruit/delete">
        <div>
            <label for="title">Название: </label>
            <input required type="text" name="title" id="title" placeholder="Введите название">
        </div>
        <div>
            <label for="price">Цена: </label>
            <input type="number" name="price" id="price" placeholder="Введите цену">
        </div>
        <input type="submit" value="УДАЛИТЬ">
    </form>
    <br>
    <h1>Форма Изменения</h1>
    <form method="post" action="fruit/patch">
        <div>
            <label for="title_patch">Название: </label>
            <input required type="text" name="title_patch" id="title_patch" placeholder="Что изменить?">
        </div>
        <div>
            <label for="price_patch">Цена: </label>
            <input type="number" name="price_patch" id="price_patch" placeholder="Что изменить?">
        </div>
        <br>
        <div>
            <label for="title_patch_change">Название: </label>
            <input type="text" name="title_patch_change" id="title_patch_change" placeholder="Как изменить?">
        </div>
        <div>
            <label for="price_patch_change">Цена: </label>
            <input type="number" name="price_patch_change" id="price_patch_change" placeholder="Как изменить?">
        </div>
        <div>
            <label for="weight_patch_change">Вес: </label>
            <input type="number" name="weight_patch_change" id="weight_patch_change" placeholder="Как изменить?">
        </div>
        <input type="submit" value="Изменить">
    </form>
    {% endif %}
</body>
</html>
