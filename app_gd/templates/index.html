<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Страница</title>
    <style>
        div
        {
            color: white;
            border: solid 1px white;
        }
        a
        {
            color:white
        }
        a:link
        {
            color:white
        }
        a:visited
        {
            color:white
        }
    </style>
</head>
<body bgcolor="black">
    <h1 style="color:white"> {{text}} </h1>
    {% if link %}
        <a href="{{link}}">Переход</a>
    {% endif %}

    {% if link_home %}
    <br>
        <a href="{{link_home}}">Переход</a>
    {% endif %}

    {% if list %}
    <br>
    {% for el in list %}
        <div align="center">
            {{el}}
        </div>
    {% endfor %}
    {% endif %}
</body>
</html>
